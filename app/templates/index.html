<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Save Instagram videos you own or have permission to download.">

    <title>MediaFetch - Instagram Video Downloader</title>

    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>

<body>

    <header class="navbar">
        <div class="logo">Insta<span>Pull</span></div>
        <div class="nav-label">UTILITY BY DARSHAN</div>
    </header>

    <main class="container">

        <section class="hero">
            <div class="tag">SIMPLE. FAST. FREE.</div>

            <h1>
                Your videos.<br>
                <span>Your way.</span>
            </h1>

            <p class="subtitle">
                Save Instagram videos you own or have permission
                to download, all in one place.
            </p>

            <div class="download-card">
                <form id="downloadForm">
                    <label for="videoUrl">Instagram video URL</label>

                    <div class="input-wrapper">
                        <input
                            type="url"
                            id="videoUrl"
                            placeholder="https://www.instagram.com/reel/..."
                            autocomplete="off"
                            inputmode="url"
                            required
                        >

                        <button type="button" id="pasteButton" class="paste-btn">
                            Paste
                        </button>
                    </div>

                    <button type="submit" class="download-btn" id="submitBtn">
                        <span id="btnText">Get video information</span>
                    </button>
                </form>

                <div id="message" class="message" role="status" aria-live="polite"></div>
            </div>

            <!-- Hidden until a video is found -->
            <div id="resultContainer" class="result-card" hidden>
                <img id="videoThumbnail" alt="" referrerpolicy="no-referrer" hidden>

                <div class="video-info">
                    <h3 id="videoTitle"></h3>
                    <p id="videoAuthor" class="video-meta"></p>
                    <p id="videoDuration" class="video-meta"></p>

                    <button type="button" id="downloadFileBtn" class="download-btn">
                        Download video (.mp4)
                    </button>
                </div>
            </div>

            <div class="features">
                <div>✓ Mobile friendly</div>
                <div>✓ Simple interface</div>
                <div>✓ No registration</div>
            </div>
        </section>

        <footer>
            InstaPull - Darshan © 2026 · Use only content you are
            authorized to download
        </footer>

    </main>

    <script src="{{ url_for('static', path='js/app.js') }}"></script>

</body>
</html>
